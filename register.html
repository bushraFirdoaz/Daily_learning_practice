<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action = "./login.html">
        <label for="name">Name</label> <br>
        <input type="text" id="name" placeholder="Enter your full name" value="" name="name" required
            pattern="^[A-Za-z ]{8,26}$"
            title="Allows only letters (A–Z, a–z) and spaces, minimum of 2 and maximum of 8 characters." /><br><br><br>
        <label for="email">Email</label><br>
        <input type="email" id="email" placeholder="Enter your Mail ID" name="email" required
            pattern="^[^\s@]+@[^\s@]+\.com$" /><br><br><br>
        <label for="password">Password</label><br>
        <input type="password" id="password" placeholder="Enter your password" required
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[@$!%*?&])[A-Za-z0-9@$!%*?&]{8,16}"
            title="Password must contain 8-16 characters, one uppercase, one lowercase, one digit and one special character (@$!%*?&)"><br><br><br>
        <label for="Number">Mobile Number</label><br>
        <input type="tel" id="number" placeholder="Enter your mobile number" required
            pattern="^[6-9]\d{9}$"><br><br><br>

        <button type="submit">SUBMIT</button>
        <button type="reset">RESET</button>
    </form>
    <br><br><br>
    <p>Already have an account?, <a href="./login.html">Login here</a></p>
</body>

</html>
