<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Unordered list - ul -->
    <!-- list items - li -->
    <ul>
        <li>Audi</li>
        <li>Thar</li>
        <li>Benz</li>
    </ul>

    <!-- Ordered list - ol -->
     <!-- List items -li -->
    <ol type = "1" start = "8">
        <li>BMW</li>
        <li>KIA</li>
    
        <ol>
            <li>Volvo</li>
            <li>Safari</li>
        </ol>
    </ol>
    <!-- Definition list - dl -->
     <!-- dt - Definition title and dd - definition data -->
    <dl>
        <dt>Cars: </dt>
        <dd>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Quia, voluptatibus.</dd>
    </dl>
</body>
</html>
